name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Ensure Debug Signing for Standalone APK
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/app-release.apk
            echo "Found APK: $APK_FILE -> copied to build-output/app-release.apk"
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build-output/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.1.6' }}
          name: "Оновлення ${{ github.ref_name || 'v1.1.6' }}"
          body: |
            ### 💰 Наші Гроші ${{ github.ref_name || 'v1.1.6' }}

            Оновлення мобільного додатку: виправлено голосове введення (перехід на сумісний із Gemini формат AAC/M4A), додано нативне автостиснення фото чеків та PNG-скріншотів через ImageManipulator, повне усунення лагів і зависань ШІ.

            #### ✨ Що нового у v1.1.6:
            - 🎙️ **Виправлено голосовий ввід (Voice)**: перехід на нативний аудіокодек AAC в контейнері MPEG-4 (`audio/m4a`, 16 кГц, 32 kbps), який на 100% підтримується Google Gemini API. Вага аудіо зменшилась до ~20 КБ, усунено помилку «Unsupported MIME type: audio/3gpp».
            - 📷 **Нативне автостиснення фото та скріншотів (`expo-image-manipulator`)**: будь-які 50МП фотографії та важкі повноекранні PNG-скріншоти (6–8 МБ) тепер миттєво зменшуються на пристрої до 1024px і оптимізуються до ~70–90 КБ JPEG.
            - ⚡ **Повне усунення лагів та зависань UI**: через передачу легких файлів (70 КБ замість 8 МБ) додаток більше не блокує потік інтерфейсу, не вибиває таймаут 16 секунд і повертає розпізнаний результат за 1-2 секунди.
            - 🎯 **Швидкий запуск камери**: чистий системний виклик камери без перевантаження нативної пам'яті.

            #### 📥 Як встановити:
            Завантажте файл `app-release.apk` нижче та відкрийте його на своєму смартфоні для оновлення.
          files: build-output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
