name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Ensure Debug Signing for Standalone APK
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/app-release.apk
            echo "Found APK: $APK_FILE -> copied to build-output/app-release.apk"
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build-output/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.1.7' }}
          name: "Оновлення ${{ github.ref_name || 'v1.1.7' }}"
          body: |
            ### 💰 Наші Гроші ${{ github.ref_name || 'v1.1.7' }}

            Комплексна переробка стабільності вбудованого ШІ: усунено причини роботи «через раз» у голосі, фото/скріншотах, тексті та ШІ-Аналітиці.

            #### ✨ Що нового у v1.1.7:
            - 🤖 **Нове відмовостійке ядро Gemini API (`callGeminiJSON`)**: прибрано заблоковану Google модель `gemini-3.6-flash`, налаштовано актуальний ланцюжок безкоштовних моделей (`gemini-3.5-flash-lite` → `gemini-3.1-flash-lite` → `gemini-3.8-flash` → `gemini-flash-latest`), додано автоповтор при `503`, плавне перемикання на іншу модель при `429`/таймауті (22–25 сек) та єдину систему відновлення для Аналітики і Головного екрана.
            - 🧠 **Повна сумісність із Gemini 3.x (Thinking)**: додано оптимальний `thinkingConfig` (`minimal` / `low`), фільтрацію службових `thought`-частин у відповідях та безпечний парсинг JSON без падінь на HTML-помилках.
            - 🎙️ **Стабільний запис голосу на всіх Android**: перехід на універсальний апаратний пресет AAC/M4A (`44100 Hz`, `64 kbps`, mono, без `isMeteringEnabled`), захист від подвійних натискань (`voiceBusyRef`), чиста зупинка без відправки битих файлів та усунення фонового скидання аудіорежиму із закритої модалки.
            - 📷 **Миттєвий відгук на фото і скріншоти**: індикатор завантаження вмикається одразу після вибору зображення, додано захист від подвійного відкриття камери/галереї, розумний ресайз тільки для зображень ширших за 1024px.
            - ⚡ **Оптимізація продуктивності**: усунено зайві повні перерендери додатку кожні 10 секунд.

            #### 📥 Як встановити:
            Завантажте файл `app-release.apk` нижче та відкрийте його на своєму смартфоні для оновлення.
          files: build-output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
