name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Ensure Debug Signing for Standalone APK
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/app-release.apk
            echo "Found APK: $APK_FILE -> copied to build-output/app-release.apk"
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build-output/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.1.3' }}
          name: "Оновлення ${{ github.ref_name || 'v1.1.3' }}"
          body: |
            ### 💰 Наші Гроші ${{ github.ref_name || 'v1.1.3' }}

            Оновлення мобільного додатку: кардинальна стабілізація та оптимізація ШІ Gemini, захист від перевищення безкоштовного ліміту (15 RPM), усунення зависань і блокувань кнопок.

            #### ✨ Що нового у v1.1.3:
            - ⚡ **Перехід на стабільні моделі Gemini (`gemini-2.5-flash` / `gemini-2.0-flash`)**: замінено застарілі та неіснуючі назви моделей на офіційні, завдяки чому запити виконуються з першого разу за ~1 секунду без каскадних помилок.
            - 🛡️ **Захист від ліміту 15 запитів/хв**: ліквідовано лавиноподібні перебори 8+ моделей; кількість спроб обмежена максимум 2 (основна + 1 запасна). При отриманні коду HTTP 429 робота миттєво припиняється з інформативним повідомленням замість марного повторного спаму API.
            - ⏱️ **Таймаут мережевих запитів (16 секунд)**: додано `fetchWithTimeout` через `AbortController`. Жоден запит більше не може "підвісити" інтерфейс або назавжди заблокувати кнопки в додатку.
            - 🧹 **Очищення кешу та оптимізація пам'яті (Heap / GC)**: фотознімки чеків тепер стискаються з якістю 0.15 (до ~90-150 КБ замість 3-5 МБ), а тимчасові файли аудіо й фото видаляються з кешу одразу після зчитування.
            - 🎙️ **Надійне зчитування голосового запису**: виправлено збереження аудіо URI в `expo-av` перед вивантаженням аудіотреку, кнопка мікрофона тепер завжди активна для зупинки запису.

            #### 📥 Як встановити:
            Завантажте файл `app-release.apk` нижче та відкрийте його на своєму смартфоні для оновлення.
          files: build-output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
