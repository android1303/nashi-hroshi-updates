name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Ensure Debug Signing for Standalone APK
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/app-release.apk
            echo "Found APK: $APK_FILE -> copied to build-output/app-release.apk"
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build-output/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.1.0' }}
          name: "Оновлення ${{ github.ref_name || 'v1.1.0' }}"
          body: |
            ### 💰 Наші Гроші ${{ github.ref_name || 'v1.1.0' }}

            Велике оновлення мобільного додатку (із виправленням стабільного запуску): автоматичне перехоплення витрат з Google Wallet (Google Pay) та банківських додатків, безпечний буфер підтвердження, розділення витрат між користувачами сім'ї та система запрошення.

            #### ✨ Що нового у v1.1.0:
            - 💳 **Автоматичне перехоплення оплат Google Wallet / Google Pay**: додано нативний фоновий сервіс Android (`NotificationListenerService`), який фіксує безконтактні оплати та сповіщення від Monobank, Приват24, ПУМБ тощо.
            - 🛡️ **Буфер підтвердження оплат (Confirmation Queue)**: платежі не записуються в базу "наосліп" — у верхньому меню з'являється бейдж із кількістю нових чеків. Ви можете одним кліком підтвердити, змінити категорію або відхилити платіж перед збереженням.
            - 📱 **Ізоляція платежів за пристроєм**: витрати з вашого Google Wallet відображаються для підтвердження лише на вашому смартфоні. Після підтвердження операція отримує ваше авторство та синхронізується з усією родиною через Firebase.
            - 👨‍👩‍👧‍👦 **Система запрошення та управління сім'єю**: модальне вікно вибору активного користувача на смартфоні, додавання нових членів родини та кнопка «Запросити в сім'ю» через системне меню Android Share з прямим посиланням на встановлення додатку.
            - 🎙 **ШІ Голосовий ввід та Сканування чеків**: оптимізовано роботу Google Gemini для миттєвої категоризації.

            #### 📥 Як встановити:
            Завантажте файл `app-release.apk` нижче та відкрийте його на своєму смартфоні для оновлення.
          files: build-output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
