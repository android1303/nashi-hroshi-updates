name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Ensure Debug Signing for Standalone APK
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/app-release.apk
            echo "Found APK: $APK_FILE -> copied to build-output/app-release.apk"
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build-output/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.8' }}
          name: "Оновлення ${{ github.ref_name || 'v1.0.8' }}"
          body: |
            ### 💰 Наші Гроші ${{ github.ref_name || 'v1.0.8' }}

            Оновлення мобільного додатку: виправлено та оптимізовано роботу голосового вводу витрат та розпізнавання фотографій чеків через ШІ.

            #### ✨ Що нового у v1.0.8:
            - 🎙 **Надійний голосовий ввід через ШІ**: повністю перероблено життєвий цикл аудіозапису (`expo-av`). Скидання аудіофокусу після завершення, очищення стану та моно-формат 64kbps усувають блокування мікрофона — запис працює стабільно та необмежену кількість разів поспіль.
            - 📷 **Швидке та стабільне сканування фото/чеків**: оптимізовано розмір фотографій з камери та галереї, запобігаючи переповненню оперативної пам'яті (OOM) на смартфонах із високою роздільною здатністю камери (12–50 МП), з миттєвою передачею в Google Gemini OCR.
            - 📊 **ШІ-Аналітик**: додано підтримку прямого голосового запиту в меню Аналітики без помилок формату аудіо.
            - 📱 **Android Home Screen Widget**: зручні кнопки швидкого запуску з робочого столу смартфона.

            #### 📥 Як встановити:
            Завантажте файл `app-release.apk` нижче та відкрийте його на своєму смартфоні.
          files: build-output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
